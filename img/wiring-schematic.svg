<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- device boxes -->
  <text x="150" y="46" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">ESP32-PoE</text>
  <rect x="60" y="60" width="180" height="450" rx="6" fill="#f6f8fa" stroke="#444" stroke-width="2"/>

  <text x="765" y="66" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">UFM-01</text>
  <rect x="660" y="80" width="210" height="230" rx="6" fill="#f6f8fa" stroke="#444" stroke-width="2"/>

  <text x="765" y="340" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">DS18B20</text>
  <rect x="660" y="350" width="210" height="145" rx="6" fill="#f6f8fa" stroke="#444" stroke-width="2"/>

  <!-- esp32 pin labels -->
  <g font-size="14" fill="#111" text-anchor="end">
    <text x="228" y="105">5V</text>
    <text x="228" y="205">GPIO32</text>
    <text x="228" y="265">GPIO35</text>
    <text x="228" y="380">3V3</text>
    <text x="228" y="435">GPIO16</text>
    <text x="228" y="475">GND</text>
  </g>

  <!-- device pin labels -->
  <g font-size="14" fill="#111">
    <text x="672" y="105">5V</text>
    <text x="672" y="205">RX</text>
    <text x="672" y="265">TX</text>
    <text x="672" y="295">GND</text>
    <text x="672" y="380">VDD</text>
    <text x="672" y="435">DATA</text>
    <text x="672" y="470">GND</text>
  </g>

  <!-- wires -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="240" y1="100" x2="660" y2="100" stroke="#c0392b"/>
    <line x1="240" y1="200" x2="660" y2="200" stroke="#333"/>
    <line x1="240" y1="260" x2="470" y2="260" stroke="#333"/>
    <line x1="550" y1="260" x2="660" y2="260" stroke="#333"/>
    <line x1="240" y1="375" x2="660" y2="375" stroke="#2471a3"/>
    <line x1="240" y1="430" x2="660" y2="430" stroke="#333"/>
    <line x1="240" y1="470" x2="330" y2="470" stroke="#333"/>
    <line x1="660" y1="290" x2="610" y2="290" stroke="#333"/>
    <line x1="660" y1="465" x2="610" y2="465" stroke="#333"/>
    <!-- 10uF leg -->
    <line x1="320" y1="100" x2="320" y2="122" stroke="#333"/>
    <line x1="320" y1="136" x2="320" y2="152" stroke="#333"/>
    <!-- 2k leg -->
    <line x1="390" y1="260" x2="390" y2="290" stroke="#333"/>
    <line x1="390" y1="330" x2="390" y2="347" stroke="#333"/>
    <!-- 5.1k leg -->
    <line x1="580" y1="375" x2="580" y2="388" stroke="#333"/>
    <line x1="580" y1="417" x2="580" y2="430" stroke="#333"/>
  </g>

  <!-- capacitor plates -->
  <g stroke="#333" stroke-width="2.5" stroke-linecap="round">
    <line x1="306" y1="122" x2="334" y2="122"/>
    <line x1="306" y1="136" x2="334" y2="136"/>
  </g>
  <text x="300" y="134" font-size="13" fill="#111" text-anchor="end">10 µF</text>

  <!-- resistors -->
  <g fill="#ffffff" stroke="#333" stroke-width="2.5">
    <rect x="470" y="245" width="80" height="30" rx="3"/>
    <rect x="375" y="290" width="30" height="40" rx="3"/>
    <rect x="565" y="388" width="30" height="29" rx="3"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="510" y="265" text-anchor="middle">1 k</text>
    <text x="418" y="315">2 k</text>
    <text x="606" y="407">5.1 k</text>
  </g>

  <!-- ground symbols -->
  <g stroke="#333" stroke-width="2.5" stroke-linecap="round">
    <line x1="307" y1="152" x2="333" y2="152"/><line x1="312" y1="158" x2="328" y2="158"/><line x1="317" y1="164" x2="323" y2="164"/>
    <line x1="377" y1="347" x2="403" y2="347"/><line x1="382" y1="353" x2="398" y2="353"/><line x1="387" y1="359" x2="393" y2="359"/>
    <line x1="317" y1="470" x2="343" y2="470"/><line x1="322" y1="476" x2="338" y2="476"/><line x1="327" y1="482" x2="333" y2="482"/>
    <line x1="597" y1="290" x2="623" y2="290"/><line x1="602" y1="296" x2="618" y2="296"/><line x1="607" y1="302" x2="613" y2="302"/>
    <line x1="597" y1="465" x2="623" y2="465"/><line x1="602" y1="471" x2="618" y2="471"/><line x1="607" y1="477" x2="613" y2="477"/>
  </g>

  <!-- junction dots -->
  <g fill="#333">
    <circle cx="320" cy="100" r="4.5"/>
    <circle cx="390" cy="260" r="4.5"/>
    <circle cx="580" cy="375" r="4.5"/>
    <circle cx="580" cy="430" r="4.5"/>
  </g>

  <text x="450" y="535" font-size="13" fill="#444" text-anchor="middle">Divider: GPIO35 sees 5 V × 2k / (1k + 2k) ≈ 3.3 V. GPIO35 is input-only, which is why it is the RX pin.</text>
</svg>
